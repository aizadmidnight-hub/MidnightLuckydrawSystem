<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw Live</title>

<!-- Firebase SDK (Untuk sambungan Live) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: url("logo/bg.jpg") no-repeat center center/cover;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    /* SKRIN PILIHAN PERANAN (ADMIN / PESERTA) */
    #roleModal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(6px);
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        padding: 20px;
    }

    .role-box {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 30px;
        border-radius: 16px;
        max-width: 400px;
        width: 100%;
    }

    .role-box h2 {
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 26px;
        letter-spacing: 1px;
    }

    .role-btn {
        width: 100%;
        padding: 15px;
        margin: 8px 0;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.15s;
    }

    .role-btn:active {
        transform: scale(0.97);
    }

    .btn-peserta {
        background: #28a745;
        color: white;
    }

    .btn-admin {
        background: #ffc107;
        color: black;
    }

    #adminLoginSection {
        display: none;
        margin-top: 15px;
    }

    #adminPassInput {
        width: 100%;
        padding: 12px;
        font-size: 18px;
        border-radius: 8px;
        border: none;
        text-align: center;
        margin-bottom: 10px;
    }

    /* LENCANA STATUS DI PENJURU BAWAH */
    #modeBadge {
        position: fixed;
        bottom: 15px;
        left: 20px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
        z-index: 40;
        display: none;
    }

    #topLeftLogo {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 140px;
        height: auto;
        z-index: 25;
        transform-origin: center;
        animation: logoFloat 3.2s ease-in-out infinite;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.28));
    }

    #listContainer {
        position: absolute;
        top: 20px;
        right: 20px;
        text-align: right;
        z-index: 20;
        display: none;
    }

    textarea {
        width: 230px;
        height: 200px;
        padding: 10px;
        font-size: 17px;
        border-radius: 10px;
        border: none;
        resize: none;
        outline: none;
    }

    #toggleBtn {
        margin-top: 6px;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 15px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        color: white;
        font-size: 22px;
        font-weight: bold;
    }

    /* BUTANG KAWALAN SENTUH UNTUK ADMIN */
    #adminControls {
        margin-top: 8px;
        display: flex;
        gap: 6px;
        justify-content: flex-end;
    }

    .spin-trigger {
        padding: 8px 12px;
        font-size: 13px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        color: white;
    }

    #resultWrapper {
        position: absolute;
        top: calc(45.5% + 60px);
        left: 50%;
        width: 100%;
        padding: 0 30px;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10;
    }

    #grandLabel {
        min-height: 52px;
        margin-bottom: 8px;
        font-size: clamp(24px, 5vw, 42px);
        font-weight: 900;
        letter-spacing: 8px;
        color: #ffd700;
        text-shadow:
            0 3px 0 #7a4b00,
            0 0 10px rgba(255, 215, 0, 0.8),
            0 0 25px rgba(255, 215, 0, 0.8);
        opacity: 0;
        transform: scale(0.5);
    }

    #grandLabel.show {
        animation: grandLabelIn 0.7s ease forwards,
                   grandLabelPulse 0.8s ease-in-out 0.7s infinite alternate;
    }

    #result {
        display: inline-block;
        font-size: clamp(70px, 15vw, 200px);
        line-height: 1;
        font-weight: bold;
        color: black;
        white-space: nowrap;
        transform-origin: center;
    }

    #result.normalRolling {
        animation: normalRoll 0.13s linear infinite;
    }

    #result.grandRolling {
        color: #ffd700;
        -webkit-text-stroke: 4px black;
        text-shadow:
            0 5px 0 #7a4b00,
            0 0 18px rgba(255, 215, 0, 0.95),
            0 0 45px rgba(255, 140, 0, 0.9);
        animation: grandRoll 0.18s ease-in-out infinite;
    }

    #result.grandReveal {
        color: #ffd700;
        -webkit-text-stroke: 4px black;
        text-shadow:
            0 5px 0 #7a4b00,
            0 0 18px rgba(255, 215, 0, 0.95),
            0 0 45px rgba(255, 140, 0, 0.9);
        animation: revealPulse 0.55s ease;
    }

    #result.grandWinner {
        color: #ffd700;
        -webkit-text-stroke: 4px black;
        text-shadow:
            0 5px 0 #7a4b00,
            0 0 20px rgba(255, 215, 0, 1),
            0 0 55px rgba(255, 100, 0, 0.95);
        animation: winnerPop 1s cubic-bezier(.2, .9, .25, 1.4);
    }

    #grandOverlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        opacity: 0;
        background:
            radial-gradient(circle at center,
                rgba(255, 225, 80, 0.30) 0%,
                rgba(255, 115, 0, 0.14) 35%,
                rgba(0, 0, 0, 0.68) 100%);
    }

    #grandOverlay.active {
        animation: overlayPulse 0.75s ease-in-out infinite alternate;
    }

    #grandOverlay.flash {
        animation: finalFlash 0.85s ease-out;
    }

    #fireworksCanvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        display: none;
        z-index: 30;
    }

    @keyframes logoFloat {
        0%   { transform: translateY(0px) rotate(0deg) scale(1); }
        25%  { transform: translateY(-4px) rotate(-1.2deg) scale(1.02); }
        50%  { transform: translateY(0px) rotate(0.8deg) scale(1.03); }
        75%  { transform: translateY(4px) rotate(-0.6deg) scale(1.01); }
        100% { transform: translateY(0px) rotate(0deg) scale(1); }
    }

    @keyframes normalRoll {
        0%   { transform: translateY(-3px) scale(0.99); filter: blur(0); }
        50%  { transform: translateY(3px) scale(1.01); filter: blur(1px); }
        100% { transform: translateY(-3px) scale(0.99); filter: blur(0); }
    }

    @keyframes grandRoll {
        0%   { transform: scale(0.92) rotate(-1deg); filter: blur(0); }
        50%  { transform: scale(1.09) rotate(1deg); filter: blur(2px); }
        100% { transform: scale(0.92) rotate(-1deg); filter: blur(0); }
    }

    @keyframes revealPulse {
        0%   { transform: scale(0.84); opacity: 0.45; }
        55%  { transform: scale(1.12); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes winnerPop {
        0%   { transform: scale(0.35); opacity: 0; }
        55%  { transform: scale(1.22); opacity: 1; }
        75%  { transform: scale(0.94); }
        100% { transform: scale(1); }
    }

    @keyframes grandLabelIn {
        from { opacity: 0; transform: scale(0.5) translateY(20px); }
        to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes grandLabelPulse {
        from { filter: brightness(0.9); transform: scale(1); }
        to   { filter: brightness(1.35); transform: scale(1.06); }
    }

    @keyframes overlayPulse {
        from { opacity: 0.35; }
        to   { opacity: 0.85; }
    }

    @keyframes finalFlash {
        0%   { opacity: 0.35; background: white; }
        30%  { opacity: 0.95; background: white; }
        100% { opacity: 0; }
    }
</style>
</head>

<body>

<!-- MODAL PILIHAN PERANAN -->
<div id="roleModal">
    <div class="role-box">
        <h2>LUCKY DRAW LIVE</h2>
        <button class="role-btn btn-peserta" onclick="enterAsParticipant()">👀 Masuk Sebagai Peserta (Live)</button>
        <button class="role-btn btn-admin" onclick="showAdminLogin()">🔑 Masuk Sebagai Admin</button>

        <div id="adminLoginSection">
            <input type="password" id="adminPassInput" placeholder="Masukkan Kata Laluan Admin">
            <button class="role-btn btn-peserta" onclick="verifyAdmin()">Sahkan & Masuk</button>
            <div id="passError" style="color: #ff6b6b; font-size: 14px; margin-top: 5px; display: none;">Kata laluan salah!</div>
        </div>
    </div>
</div>

<div id="modeBadge"></div>
<img id="topLeftLogo" src="logo/mg.png" alt="Logo">

<div id="grandOverlay"></div>
<canvas id="fireworksCanvas"></canvas>

<div id="listContainer">
    <textarea id="numberInput" placeholder="Enter numbers&#10;one per line"></textarea>
    <div>
        <button id="toggleBtn" onclick="toggleList()">—</button>
    </div>
    <div id="adminControls">
        <button class="spin-trigger" style="background:#007bff;" onclick="startNormalDraw()">Spin (Space)</button>
        <button class="spin-trigger" style="background:#d97706;" onclick="startGrandDraw()">Grand (Shift)</button>
    </div>
</div>

<div id="resultWrapper">
    <div id="grandLabel">GRAND PRIZE</div>
    <div id="result"></div>
</div>

<audio id="spinSound" src="sound/spin.mp3" preload="auto"></audio>
<audio id="grandPrizeSound" src="sound/grandprize.mp3" preload="auto"></audio>
<audio id="winSound" src="sound/win.mp3" preload="auto"></audio>

<script>
    /* ==============================================================
       1. TETAPAN FIREBASE ANDA (SUDAH DIMASUKKAN)
       ============================================================== */
    const firebaseConfig = {
        databaseURL: "https://mg-luckydraw-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const liveRef = db.ref("luckyDrawLive");

    /* ==============================================================
       2. KAWALAN PERANAN (ADMIN VS PESERTA)
       ============================================================== */
    let userRole = null;
    const ADMIN_PASSWORD = "75944624";

    function showAdminLogin() {
        document.getElementById("adminLoginSection").style.display = "block";
        document.getElementById("adminPassInput").focus();
    }

    document.getElementById("adminPassInput").addEventListener("keyup", function(e) {
        if (e.key === "Enter") verifyAdmin();
    });

    function unlockAudio() {
        [spinSound, grandPrizeSound, winSound].forEach(audio => {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(() => {});
        });
    }

    function verifyAdmin() {
        const input = document.getElementById("adminPassInput").value;
        if (input === ADMIN_PASSWORD) {
            userRole = "admin";
            unlockAudio();
            document.getElementById("roleModal").style.display = "none";
            document.getElementById("listContainer").style.display = "block";
            const badge = document.getElementById("modeBadge");
            badge.style.display = "block";
            badge.textContent = "🟢 Mod Admin (Kawalan Aktif)";
        } else {
            document.getElementById("passError").style.display = "block";
        }
    }

    function enterAsParticipant() {
        userRole = "participant";
        unlockAudio();
        document.getElementById("roleModal").style.display = "none";
        document.getElementById("listContainer").remove();
        const badge = document.getElementById("modeBadge");
        badge.style.display = "block";
        badge.textContent = "🔴 LIVE — Paparan Peserta";
        listenToLiveUpdates();
    }

    function broadcastState(payload) {
        if (userRole !== "admin") return;
        liveRef.set({
            ...payload,
            timestamp: Date.now()
        });
    }

    /* ==============================================================
       3. PEMBOLEHUBAH & FUNGSI ASAL SISTEM
       ============================================================== */
    let numbers = [];
    let listVisible = true;
    let rollingInterval = null;
    let rollingTimeout = null;
    let isDrawing = false;

    const result = document.getElementById("result");
    const grandLabel = document.getElementById("grandLabel");
    const grandOverlay = document.getElementById("grandOverlay");
    const spinSound = document.getElementById("spinSound");
    const grandPrizeSound = document.getElementById("grandPrizeSound");
    const winSound = document.getElementById("winSound");

    function loadNumbers() {
        const area = document.getElementById("numberInput");
        if (!area) return;
        const raw = area.value.split("\n");
        numbers = raw.map(n => n.trim()).filter(n => n !== "");
    }

    function toggleList(forceHide = false) {
        const area = document.getElementById("numberInput");
        const btn = document.getElementById("toggleBtn");
        if (!area || !btn) return;

        if (forceHide || listVisible) {
            area.style.display = "none";
            btn.innerHTML = "+";
            listVisible = false;
        } else {
            area.style.display = "block";
            btn.innerHTML = "—";
            listVisible = true;
        }
    }

    function resetEffects() {
        clearInterval(rollingInterval);
        clearTimeout(rollingTimeout);

        result.className = "";
        grandLabel.className = "";
        grandOverlay.className = "";

        spinSound.pause();
        spinSound.currentTime = 0;

        grandPrizeSound.pause();
        grandPrizeSound.currentTime = 0;

        winSound.pause();
        winSound.currentTime = 0;
    }

    function playSpinSound(isGrand = false) {
        if (isGrand) {
            grandPrizeSound.pause();
            grandPrizeSound.currentTime = 0;
            grandPrizeSound.play().catch(() => {});
        } else {
            spinSound.pause();
            spinSound.currentTime = 0;
            spinSound.play().catch(() => {});
        }
    }

    /* =========================
       NORMAL DRAW (ADMIN)
       ========================= */
    function startNormalDraw() {
        if (userRole !== "admin" || isDrawing) return;

        loadNumbers();
        toggleList(true);

        if (numbers.length === 0) {
            result.innerHTML = "NONE";
            return;
        }

        isDrawing = true;
        resetEffects();
        playSpinSound(false);

        result.classList.add("normalRolling");

        broadcastState({
            state: "normal_rolling",
            pool: numbers.slice(0, 50)
        });

        rollingInterval = setInterval(() => {
            const randomNum = numbers[Math.floor(Math.random() * numbers.length)];
            result.textContent = randomNum;
        }, 50);

        rollingTimeout = setTimeout(stopNormalRolling, 2500);
    }

    function stopNormalRolling() {
        clearInterval(rollingInterval);

        const index = Math.floor(Math.random() * numbers.length);
        const picked = numbers[index];

        numbers.splice(index, 1);

        result.className = "";
        result.textContent = picked;
        document.getElementById("numberInput").value = numbers.join("\n");

        broadcastState({
            state: "normal_win",
            winner: picked
        });

        startFireworks(false);
        isDrawing = false;
    }

    /* =========================
       GRAND PRIZE (ADMIN)
       ========================= */
    function startGrandDraw() {
        if (userRole !== "admin" || isDrawing) return;

        loadNumbers();
        toggleList(true);

        if (numbers.length === 0) {
            result.innerHTML = "NONE";
            return;
        }

        isDrawing = true;
        resetEffects();

        grandLabel.classList.add("show");
        grandOverlay.classList.add("active");
        result.classList.add("grandRolling");

        playSpinSound(true);

        broadcastState({
            state: "grand_rolling",
            pool: numbers.slice(0, 50)
        });

        let rollSpeed = 45;
        let elapsed = 0;

        function dramaticRoll() {
            clearInterval(rollingInterval);

            rollingInterval = setInterval(() => {
                const randomNum = numbers[Math.floor(Math.random() * numbers.length)];
                result.textContent = randomNum;

                elapsed += rollSpeed;

                if (elapsed > 2600 && rollSpeed === 45) {
                    rollSpeed = 80;
                    dramaticRoll();
                } else if (elapsed > 3700 && rollSpeed === 80) {
                    rollSpeed = 140;
                    dramaticRoll();
                } else if (elapsed > 4600 && rollSpeed === 140) {
                    clearInterval(rollingInterval);
                    beginGrandReveal();
                }
            }, rollSpeed);
        }

        dramaticRoll();
    }

    function beginGrandReveal() {
        clearInterval(rollingInterval);

        const index = Math.floor(Math.random() * numbers.length);
        const picked = numbers[index];

        numbers.splice(index, 1);
        document.getElementById("numberInput").value = numbers.join("\n");

        result.className = "";
        result.classList.add("grandReveal");

        const characters = Array.from(picked);
        let revealedCount = 0;

        function maskedNumber() {
            return characters.map((char, i) => {
                if (i < revealedCount) return char;
                return char === " " ? "\u00A0" : "•";
            }).join("");
        }

        const initialMask = maskedNumber();
        result.textContent = initialMask;

        broadcastState({
            state: "grand_reveal",
            display: initialMask
        });

        const revealInterval = setInterval(() => {
            revealedCount++;

            result.classList.remove("grandReveal");
            void result.offsetWidth;
            result.classList.add("grandReveal");

            const currentMask = maskedNumber();
            result.textContent = currentMask;

            broadcastState({
                state: "grand_reveal",
                display: currentMask
            });

            if (revealedCount >= characters.length) {
                clearInterval(revealInterval);

                setTimeout(() => {
                    result.className = "";
                    result.classList.add("grandWinner");
                    result.textContent = picked;

                    grandPrizeSound.pause();
                    grandPrizeSound.currentTime = 0;

                    winSound.pause();
                    winSound.currentTime = 0;
                    winSound.play().catch(() => {});

                    grandOverlay.className = "";
                    grandOverlay.classList.add("flash");

                    broadcastState({
                        state: "grand_win",
                        winner: picked
                    });

                    startFireworks(true);

                    setTimeout(() => {
                        grandLabel.classList.remove("show");
                        grandOverlay.className = "";
                        isDrawing = false;
                    }, 6000);
                }, 700);
            }
        }, 1200);
    }

    /* ==============================================================
       4. PENDENGAR LIVE UNTUK SKRIN PESERTA
       ============================================================== */
    let lastTimestamp = 0;

    function listenToLiveUpdates() {
        liveRef.on("value", (snapshot) => {
            const data = snapshot.val();
            if (!data || data.timestamp === lastTimestamp) return;
            lastTimestamp = data.timestamp;

            if (data.state === "normal_rolling") {
                resetEffects();
                playSpinSound(false);
                result.classList.add("normalRolling");
                const pool = data.pool || ["..."];
                rollingInterval = setInterval(() => {
                    result.textContent = pool[Math.floor(Math.random() * pool.length)];
                }, 50);
            } 
            else if (data.state === "normal_win") {
                clearInterval(rollingInterval);
                result.className = "";
                result.textContent = data.winner;
                startFireworks(false);
            } 
            else if (data.state === "grand_rolling") {
                resetEffects();
                grandLabel.classList.add("show");
                grandOverlay.classList.add("active");
                result.classList.add("grandRolling");
                playSpinSound(true);
                const pool = data.pool || ["..."];
                rollingInterval = setInterval(() => {
                    result.textContent = pool[Math.floor(Math.random() * pool.length)];
                }, 60);
            } 
            else if (data.state === "grand_reveal") {
                clearInterval(rollingInterval);
                grandLabel.classList.add("show");
                grandOverlay.classList.add("active");
                result.className = "";
                void result.offsetWidth;
                result.classList.add("grandReveal");
                result.textContent = data.display;
            } 
            else if (data.state === "grand_win") {
                clearInterval(rollingInterval);
                result.className = "";
                result.classList.add("grandWinner");
                result.textContent = data.winner;

                grandPrizeSound.pause();
                grandPrizeSound.currentTime = 0;
                winSound.play().catch(() => {});

                grandOverlay.className = "";
                grandOverlay.classList.add("flash");
                startFireworks(true);

                setTimeout(() => {
                    grandLabel.classList.remove("show");
                    grandOverlay.className = "";
                }, 6000);
            }
        });
    }

    /* KAWALAN PAPAN KEKUNCI (ADMIN SAHAJA) */
    document.addEventListener("keydown", function(e) {
        if (userRole !== "admin") return;
        if (e.repeat) return;

        if (e.code === "Space") {
            e.preventDefault();
            startNormalDraw();
        }

        if (e.key === "Shift") {
            e.preventDefault();
            startGrandDraw();
        }
    });

    /* =========================
       FIREWORKS
       ========================= */
    function startFireworks(isGrand = false) {
        const canvas = document.getElementById("fireworksCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.display = "block";

        let fireworks = [];
        let particles = [];

        const duration = isGrand ? 6000 : 3000;
        const startTime = Date.now();

        function Firework() {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height;
            this.targetY = Math.random() * canvas.height * 0.5 + 50;
            this.speed = isGrand ? 9 : 7;
            this.boom = false;
        }

        function Particle(x, y) {
            this.x = x;
            this.y = y;
            this.speedX = (Math.random() - 0.5) * (isGrand ? 10 : 6);
            this.speedY = (Math.random() - 0.5) * (isGrand ? 10 : 6);
            this.alpha = 1;
            this.size = Math.random() * (isGrand ? 4 : 2) + 2;
            this.color = isGrand
                ? ["#ffffff", "#ffd700", "#ff8c00"][Math.floor(Math.random() * 3)]
                : "#ffffff";
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (Date.now() - startTime < duration) {
                const launchChance = isGrand ? 0.13 : 0.05;
                if (Math.random() < launchChance) {
                    fireworks.push(new Firework());
                }
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                if (!fw.boom) {
                    fw.y -= fw.speed;
                    ctx.fillStyle = isGrand ? "#ffd700" : "white";
                    ctx.fillRect(fw.x, fw.y, 4, 12);

                    if (fw.y <= fw.targetY) {
                        fw.boom = true;
                        const particleCount = isGrand ? 75 : 30;
                        for (let j = 0; j < particleCount; j++) {
                            particles.push(new Particle(fw.x, fw.y));
                        }
                        fireworks.splice(i, 1);
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.speedY += 0.035;
                p.alpha -= isGrand ? 0.012 : 0.02;

                ctx.globalAlpha = Math.max(p.alpha, 0);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (Date.now() - startTime < duration || particles.length > 0) {
                requestAnimationFrame(loop);
            } else {
                canvas.style.display = "none";
            }
        }

        loop();
    }

    window.addEventListener("resize", () => {
        const canvas = document.getElementById("fireworksCanvas");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>

</body>
</html>
